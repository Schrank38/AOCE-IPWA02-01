server.port=8081
spring.application.name=ghostnet

# File-based H2 database. Data survives application restarts.
# The database file is created in the application working directory.
spring.datasource.url=jdbc:h2:file:./ghostnetdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable only for local development and database screenshots.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console