<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neues Geisternetz melden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            background-color: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="container mt-5">
    <div class="form-container">
        <h2>Neues Geisternetz melden</h2>

        <!-- Zeigt den Fehler an (z. B. wenn Name ohne Telefonnummer eingegeben wurde) -->
        <div th:if="${fehler}" class="alert alert-danger" th:text="${fehler}"></div>

        <form th:action="@{/netze/speichern}" method="post">
            
            <div>
                <div class="mb-3">
                    <label class="form-label">Breitengrad</label>
                    <input type="text" class="form-control" name="latitude" required placeholder="z. B. 54,12 oder 54.12">
                </div>
                <div class="mb-3">
                    <label class="form-label">Längengrad</label>
                    <input type="text" class="form-control" name="longitude" required placeholder="z. B. 10,5 oder 10.5">
                </div>
                <div class="mb-3">
                    <label class="form-label">Geschätzte Größe (m²)</label>
                    <input type="text" class="form-control" name="groesse" required placeholder="z. B. 15,0 oder 15">
                </div>
            </div>
            
            <hr class="my-4">
            <h4>Meldende Person</h4>
            <p class="text-muted small mb-3">Lassen Sie beide Felder leer, um anonym zu melden. Bei einer namentlichen Meldung sind Name und Telefonnummer erforderlich.</p>
            
            <div th:object="${person}">
                <div class="mb-3">
                    <label class="form-label">Name (optional)</label>
                    <!-- th:field sorgt dafür, dass der eingegebene Name bei einem Fehler erhalten bleibt -->
                    <input type="text" class="form-control" th:field="*{name}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefonnummer (bei Namensangabe erforderlich)</label>
                    <input type="text" class="form-control" th:field="*{telefonnummer}">
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-success me-2">Meldung abschicken</button>
                <a th:href="@{/netze}" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </div>
</body>
</html>
