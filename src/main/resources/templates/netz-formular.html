<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neues Geisternetz melden</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1>Neues Geisternetz melden</h1>
    <form th:action="@{/netze/neu}" th:object="${netz}" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Breitengrad (Latitude):</label>
            <input type="number" step="any" th:field="*{latitude}" class="form-control" placeholder="z. B. 54.1234" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Längengrad (Longitude):</label>
            <input type="number" step="any" th:field="*{longitude}" class="form-control" placeholder="z. B. 10.5678" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Geschätzte Größe (Meter):</label>
            <input type="number" step="any" th:field="*{groesse}" class="form-control" placeholder="z. B. 15" required/>
        </div>

        <h4 class="mt-4">Meldende Person (Optional für Anonymität)</h4>
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" th:field="*{meldendePerson.name}" class="form-control" placeholder="Leer lassen für anonyme Meldung"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefonnummer:</label>
            <input type="text" th:field="*{meldendePerson.telefonnummer}" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-success">Meldung abschicken</button>
        <a href="/netze" class="btn btn-secondary">Abbrechen</a>
    </form>
</body>
</html>
